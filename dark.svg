<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Profile terminal dark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="avatarClip">
      <rect x="60" y="90" width="240" height="240" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <rect x="40" y="40" width="1120" height="340" rx="20" fill="#0f172a" stroke="#334155" filter="url(#shadow)"/>

  <circle cx="78" cy="70" r="7" fill="#ef4444"/>
  <circle cx="102" cy="70" r="7" fill="#f59e0b"/>
  <circle cx="126" cy="70" r="7" fill="#22c55e"/>

  <text x="160" y="75" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">vaibhav@portfolio: ~</text>

  <image href="./profile.jpg" x="60" y="90" width="240" height="240" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>
  <rect x="60" y="90" width="240" height="240" rx="18" fill="none" stroke="#334155"/>

  <text x="340" y="130" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">$ whoami</text>
  <text x="340" y="170" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="700">VAIBHAV CHAUDHARY</text>

  <text x="340" y="215" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">$ role</text>
  <text x="340" y="250" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28">Developer</text>

  <text x="340" y="295" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">$ skills --top</text>
  <text x="340" y="330" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22">JavaScript • Python • C++</text>
</svg>
